spring:
  application:
    name: stayhub

  datasource:
    url: jdbc:h2:mem:stayhub
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

stayhub:
  suppliers:
    a:
      base-url: http://localhost:9090
      api-key: mock-key-a
      connect-timeout: 1s
      response-timeout: 3s
    b:
      base-url: http://localhost:9090
      api-key: mock-key-b
      connect-timeout: 1s
      response-timeout: 3s

  sync:
    interval: 6h
    retry-initial: 30s
    retry-max: 5m
    retry-max-attempts: 5

  search:
    deadline: 5s
    chunk-size: 50
    concurrency-per-supplier: 4
